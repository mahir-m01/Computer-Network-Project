upstream cn_backends {
    server 10.200.99.31:3001 max_fails=1 fail_timeout=5s;
    server 10.200.99.32:3002 max_fails=1 fail_timeout=5s;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.cnproject.test api.cnproject.test;

    ssl_certificate /etc/nginx/cn-tls/edge.crt;
    ssl_certificate_key /etc/nginx/cn-tls/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://cn_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
